name: Release

# Ein Tag v* veröffentlicht das Image (amd64 + arm64) in GHCR und legt ein GitHub-Release
# mit install.sh, agentpc.json, Release-Archiv und SHA256SUMS an.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tag passt zur Version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ≠ package.json $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run lint && npm run build && npm test
      - run: shellcheck -x scripts/*.sh
      - name: Installationstest (Debian 13)
        run: tests/agentpc/run.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zappotex/bonys-agents-mission-control:${{ steps.version.outputs.version }}
            ghcr.io/zappotex/bonys-agents-mission-control:latest
      - name: Release-Dateien bauen
        run: bash scripts/make-bundle.sh dist-release
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Mission Control ${{ steps.version.outputs.version }}" \
            --notes-file docs/release-notes/${{ steps.version.outputs.version }}.md \
            dist-release/bonys-mission-control-*.tar.gz dist-release/install.sh \
            dist-release/agentpc.json dist-release/SHA256SUMS
