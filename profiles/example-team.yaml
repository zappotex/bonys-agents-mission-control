name: Example Team
slug: example-team
description: Neutral example profile for public installs.
theme: default-dark

agents:
  - id: coordinator
    name: Atlas
    role: Team Coordination
    type: hermes-peer
    peer: atlas
    tags: [coordination, planning, review]
    enabled: true
  - id: research
    name: Nova
    role: Research Specialist
    type: hermes-peer
    peer: nova
    tags: [research, sources, fact-check]
    enabled: true
  - id: writer
    name: Scribe
    role: Writer / Documentation
    type: hermes-peer
    peer: scribe
    tags: [writing, documentation, structure]
    enabled: true

team:
  owner: Your Name
  coordinator: Atlas
  agents:
    - Atlas
    - Nova
    - Scribe

integrations:
  hermes:
    enabled: false
    peers: []
  obsidian:
    enabled: false
    path: null
  video_outputs:
    enabled: false
    path: null

privacy:
  contains_private_values: false
  publish_safe: true
